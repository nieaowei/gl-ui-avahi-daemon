name: Test and build APK
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/test-release-version.py
      - name: Resolve upstream Avahi version and project commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py
      - run: npm test
      - run: sh scripts/build-apk.sh
      - run: node scripts/test-apk.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: gl-ui-avahi-daemon-apk
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
