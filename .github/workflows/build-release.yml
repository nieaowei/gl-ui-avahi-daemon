name: Build and release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'Makefile'
      - 'files/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gl-ui-avahi-daemon-release
  cancel-in-progress: false

jobs:
  build:
    name: Resolve, test and build APKv3
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      filename: ${{ steps.version.outputs.filename }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_ref: ${{ steps.version.outputs.upstream_ref }}
      upstream_commit: ${{ steps.version.outputs.upstream_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/test-release-version.py
      - name: Pin upstream Avahi version and UI commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prepare-release.py
      - run: npm test
      - run: sh scripts/build-apk.sh
      - run: node scripts/test-apk.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: gl-ui-avahi-daemon-release
          path: |
            dist/*.apk
            dist/*.apk.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned GitHub Release
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: gl-ui-avahi-daemon-release
          path: dist
      - name: Publish this exact build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.build.outputs.name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_RELEASE: ${{ needs.build.outputs.release }}
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          UPSTREAM_REF: ${{ needs.build.outputs.upstream_ref }}
          UPSTREAM_COMMIT: ${{ needs.build.outputs.upstream_commit }}
        run: |
          set -euo pipefail
          file="dist/$PACKAGE_FILE"
          checksum="$file.sha256"
          test -s "$file"
          (cd dist && sha256sum -c "$PACKAGE_FILE.sha256")
          # Check existing tags too, including tags with no Release yet.
          if existing_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Release $RELEASE_TAG belongs to $existing_sha; refusing to overwrite it with $GITHUB_SHA."
              exit 1
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$file" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$file" "$checksum" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$PACKAGE_NAME $PACKAGE_VERSION-r$PACKAGE_RELEASE" \
              --notes "OpenWrt APKv3 (noarch) built from UI commit $GITHUB_SHA. Version follows openwrt/packages libs/avahi/Makefile on $UPSTREAM_REF, pinned at $UPSTREAM_COMMIT. Unsigned at origin; SHA256 checksum included."
          fi
          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$PACKAGE_FILE" --pattern "$PACKAGE_FILE.sha256" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c "$PACKAGE_FILE.sha256")
